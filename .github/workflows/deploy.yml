name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build static export
        # The site is served from https://<user>.github.io/sasiniwanigathunga/,
        # so every asset needs that prefix. Change this (and next.config.ts
        # picks it up) if the site moves to a custom domain or a user site.
        env:
          NEXT_PUBLIC_BASE_PATH: /sasiniwanigathunga
        run: npm run build

      # `enablement` turns Pages on via the API if it has never been enabled,
      # instead of failing with "Get Pages site failed" and waiting for someone
      # to flip the switch in Settings → Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
