name: Deploy to GitHub Pages

# Prerequisite, one time only: Settings → Pages → Build and deployment →
# Source: GitHub Actions. The workflow cannot do this for you - GITHUB_TOKEN
# is not allowed to create a Pages site, even with `pages: write`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build static export
        # The site is served from https://<user>.github.io/sasiniwanigathunga/,
        # so every asset needs that prefix. Change this (and next.config.ts
        # picks it up) if the site moves to a custom domain or a user site.
        env:
          NEXT_PUBLIC_BASE_PATH: /sasiniwanigathunga
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
